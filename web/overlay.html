<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subtitles</title>
<style>
  :root {
    --size: 44px;
    --lh: 1.25;
    --font: "Segoe UI", system-ui, Arial, sans-serif;
    --weight: 700;
    --color: #ffffff;
    --partial: #ffffffcc;
    --bg: #000000a6;
    --lines: 2;
    --width: 80vw;
    --radius: 14px;
    --stroke: 0px;
    --stroke-color: #000000;
    --shadow: 0 2px 6px #000000b3;
    --align: center;
    --margin: 6vh;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: var(--margin) 4vw;
    box-sizing: border-box;
  }
  body.top { justify-content: flex-start; }
  body.left { align-items: flex-start; }
  body.right { align-items: flex-end; }

  #box {
    max-width: var(--width);
    background: var(--bg);
    border-radius: var(--radius);
    padding: .3em .7em;
    box-sizing: border-box;
    transition: opacity .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1);
  }
  body.fixed #box { width: var(--width); }
  #box.hidden { opacity: 0; transform: translateY(12px) scale(.98); }
  body.top #box.hidden { transform: translateY(-12px) scale(.98); }
  body[data-anim="none"] #box.hidden { transform: none; }

  /* Shows only the newest N lines: older text slides off the top. */
  #clip {
    max-height: calc(var(--lines) * var(--lh) * var(--size));
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  #text {
    flex: none;
    font-family: var(--font);
    font-size: var(--size);
    font-weight: var(--weight);
    line-height: var(--lh);
    color: var(--color);
    text-align: var(--align);
    text-shadow: var(--shadow);
    -webkit-text-stroke: var(--stroke) var(--stroke-color);
    paint-order: stroke fill;
    overflow-wrap: anywhere;
  }

  /* One span per word, so each new word can animate on its own. */
  .w { display: inline-block; transition: color .3s ease; }
  .w.partial { color: var(--partial); }
  .in { animation: w-fade .32s cubic-bezier(.2, .8, .2, 1) both; }
  body[data-anim="rise"] .in { animation-name: w-rise; }
  body[data-anim="pop"] .in { animation-name: w-pop; animation-timing-function: cubic-bezier(.3, 1.6, .5, 1); }
  body[data-anim="blur"] .in { animation-name: w-blur; animation-duration: .4s; }
  body[data-anim="drop"] .in { animation-name: w-drop; animation-duration: .45s; }
  body[data-anim="type"] .in { animation: w-fade 1ms step-end both; }
  @keyframes w-fade { from { opacity: 0; } }
  @keyframes w-rise { from { opacity: 0; transform: translateY(.45em); } }
  @keyframes w-pop  { from { opacity: 0; transform: scale(.4); } }
  @keyframes w-blur { from { opacity: 0; filter: blur(.25em); } }
  @keyframes w-drop {
    0%   { opacity: 0; transform: translateY(-.6em); }
    60%  { opacity: 1; transform: translateY(.08em); }
    100% { transform: none; }
  }
</style>
</head>
<body>
<div id="box" class="hidden"><div id="clip"><div id="text"></div></div></div>
<script>
"use strict";
// Every look setting comes from the URL, e.g. /overlay?size=56&color=ffff00&lines=3
// The setup page at / builds this URL for you.
const q = new URLSearchParams(location.search);
const css = document.documentElement.style;
const color = v => /^[0-9a-f]{3,8}$/i.test(v) ? "#" + v : v;
const px = v => v + "px";
const params = {
  size: ["--size", px], weight: ["--weight"], color: ["--color", color],
  partial: ["--partial", color], bg: ["--bg", color], lines: ["--lines"],
  width: ["--width", v => v + "vw"], radius: ["--radius", px],
  stroke: ["--stroke", px], strokecolor: ["--stroke-color", color],
  align: ["--align"], margin: ["--margin", v => v + "vh"],
};
for (const [key, [prop, fn = v => v]] of Object.entries(params)) {
  if (q.get(key)) css.setProperty(prop, fn(q.get(key)));
}
if (q.get("shadow") === "0") css.setProperty("--shadow", "none");

const font = q.get("font");
if (font) {
  css.setProperty("--font", `"${font.replace(/["\\]/g, "")}", system-ui, sans-serif`);
  if (q.get("gfont") === "1") {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=" +
      encodeURIComponent(font).replace(/%20/g, "+") + ":wght@400;500;600;700;800;900&display=swap";
    document.head.append(link);
  }
}
document.body.classList.add(q.get("pos") === "top" ? "top" : "bottom");
if (q.get("align") === "left" || q.get("align") === "right") document.body.classList.add(q.get("align"));
if (q.get("fixed") === "1") document.body.classList.add("fixed");

const fadeAfter = parseFloat(q.get("fade") ?? "6");
const caseMode = q.get("case") || "none";
// Word animation: rise | fade | pop | blur | drop | type | none
const anim = ["rise", "fade", "pop", "blur", "drop", "type", "none"].includes(q.get("anim")) ? q.get("anim") : "rise";
document.body.dataset.anim = anim;

const box = document.getElementById("box");
const text = document.getElementById("text");
let finals = [];
let partial = "";
let fadeTimer = 0;
// Words currently on screen: { w: text, el: <span>, sp: space before it }
let shown = [];

function fmt(t) {
  switch (caseMode) {
    case "upper": return t.toUpperCase();
    case "lower": return t.toLowerCase();
    case "sentence":
      return t.toLowerCase()
        .replace(/(^\s*|[.!?]\s+)(\p{L})/gu, (_, a, b) => a + b.toUpperCase())
        .replace(/\bi\b/g, "I");
    default: return t;
  }
}

function words() {
  const out = [];
  const add = (t, final) => { for (const w of fmt(t).split(/\s+/)) if (w) out.push({ w, final }); };
  finals.forEach(f => add(f, true));
  if (partial) add(partial, false);
  return out;
}

function clearText() {
  finals = []; partial = ""; shown = []; text.textContent = "";
}

function render() {
  const next = words();
  const animate = anim !== "none" && !box.classList.contains("hidden");
  const topBefore = animate ? text.getBoundingClientRect().top : 0;

  // Keep the words that are unchanged; the recognizer may rewrite the last few.
  let keep = 0;
  while (keep < shown.length && keep < next.length && shown[keep].w === next[keep].w) keep++;
  for (const s of shown.splice(keep)) { s.sp?.remove(); s.el.remove(); }

  // New words arrive in bursts, so spread them out to read like natural speech.
  const added = next.slice(keep);
  const step = added.length > 1 ? Math.min(140, 700 / added.length) : 0;
  added.forEach((x, i) => {
    const sp = shown.length ? document.createTextNode(" ") : null;
    const el = document.createElement("span");
    el.className = anim === "none" ? "w" : "w in";
    el.style.animationDelay = i * step + "ms";
    el.textContent = x.w;
    if (sp) text.append(sp);
    text.append(el);
    shown.push({ w: x.w, el, sp });
  });
  shown.forEach((s, i) => s.el.classList.toggle("partial", !next[i].final));

  const empty = next.length === 0;
  box.classList.toggle("hidden", empty);

  // When a new line pushes the text up, glide instead of jumping.
  if (animate) {
    text.getAnimations().forEach(a => a.cancel());
    const shift = topBefore - text.getBoundingClientRect().top;
    if (shift > 1) {
      text.animate(
        [{ transform: `translateY(${shift}px)` }, { transform: "none" }],
        { duration: 320, easing: "cubic-bezier(.2, .8, .2, 1)" });
    }
  }

  clearTimeout(fadeTimer);
  if (fadeAfter > 0 && !empty) {
    fadeTimer = setTimeout(() => {
      box.classList.add("hidden");
      // Forget old lines once faded out, unless new speech arrived meanwhile.
      setTimeout(() => { if (box.classList.contains("hidden")) clearText(); }, 400);
    }, fadeAfter * 1000);
  }
}

function onMessage(msg) {
  if (msg.type === "partial") {
    partial = msg.text;
  } else if (msg.type === "final") {
    finals.push(msg.text);
    finals = finals.slice(-20);
    partial = "";
  }
  render();
}

function connect() {
  const es = new EventSource("/events");
  es.onmessage = e => { try { onMessage(JSON.parse(e.data)); } catch {} };
  es.onerror = () => {
    // The browser retries on its own unless the stream was closed for good.
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
  };
}

// demo=1 plays sample lines so you can position the overlay without talking.
// Words come in bursts every ~1.2 s, the way the speech model delivers them.
const demoLines = [
  "Hey chat, welcome back to the stream!",
  "These subtitles update live while I talk.",
  "Everything runs on my own PC, nothing goes to the cloud.",
  "You can change the font, size and colours on the setup page.",
];
let demoIndex = 0;
function demo() {
  const line = demoLines[demoIndex++ % demoLines.length].split(" ");
  let n = 0;
  const tick = () => {
    n = Math.min(line.length, n + 2 + Math.floor(Math.random() * 3));
    onMessage({ type: "partial", text: line.slice(0, n).join(" ") });
    if (n < line.length) {
      setTimeout(tick, 1200);
    } else {
      setTimeout(() => { onMessage({ type: "final", text: line.join(" ") }); setTimeout(demo, 900); }, 900);
    }
  };
  setTimeout(tick, 300);
}

if (q.get("demo") === "1") demo(); else connect();
</script>
</body>
</html>
